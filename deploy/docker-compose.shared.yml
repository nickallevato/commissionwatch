name: commissionwatch

# Deployment onto the shared `*.bmux.sh` platform host (your-org/platform-aws).
#
# Shape differs from deploy/docker-compose.yml in three ways that matter:
#
# 1. NETWORKS. `edge` is the platform's external network that the shared Caddy
#    lives on; only the web container joins it, because only the web container
#    should be reachable from the front door. Everything else sits on a PRIVATE
#    network created by this stack.
#
#    Note we deliberately do NOT join the platform's shared `internal` network.
#    That network exists so products can reach the shared Postgres. This product
#    runs its own database (see 2), so joining it would only make our Postgres
#    and MinIO reachable by the seven other products on the host for no benefit.
#
# 2. OWN DATABASE. The platform's shared Postgres is postgres:15-alpine, which
#    does not ship pgvector. Migration 007 runs `CREATE EXTENSION vector` at
#    container start, so on the shared database the backend would crash-loop
#    forever. `drift` sets the precedent for a per-product data sidecar with its
#    own Redis.
#
# 3. NO PUBLISHED PORTS. Not one service maps a host port. The host's security
#    group leaves :80 open to the world for ACME, so anything bound to
#    0.0.0.0 is internet-reachable. Caddy reaches the web container over `edge`.
#
# The host is a t4g.medium: 2 vCPU / 4 GB, arm64. Images MUST be built for
# linux/arm64 or they fail at startup with `exec format error`. Memory limits
# below are deliberate — this stack shares 4 GB with Caddy, the shared Postgres,
# and seven other product stacks.

services:
  web:
    image: ${IMAGE_FRONTEND}
    container_name: commissionwatch-web
    restart: unless-stopped
    networks:
      - edge
      - cw-internal
    mem_limit: 128m
    # Ordering only, no longer load-bearing. The crash-loop this was added for —
    # nginx resolving a literal upstream at config-parse time and exiting with
    # `[emerg] host not found in upstream "backend"` — is fixed properly in
    # frontend/nginx.conf, which now defers resolution to request time. Verified
    # 2026-08-06: the proxy starts and stays up with the backend absent, and
    # recovers with zero restarts once it appears.
    #
    # Kept because starting in a sensible order still avoids a window of 502s,
    # and because depends_on does not help on a host reboot anyway.
    #
    # service_healthy, NOT service_started. `up -d --wait` treats a started
    # process as a successful deploy, so with service_started a backend that
    # boots and immediately dies — and is restarted forever by
    # restart: unless-stopped — deploys as a green build serving 502s, and the
    # version-skew check further down the deploy script never even runs.
    # Verified 2026-08-09 in production: sha 1fb246f deployed "successfully"
    # with /api/health, /api/version and /api/meetings all 502.
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, NOT localhost. /etc/hosts in this image maps localhost to
      # both 127.0.0.1 and ::1, busybox wget tries ::1 first, and nginx listens
      # only on IPv4 0.0.0.0:3000 — so `wget http://localhost:3000/` fails with
      # "can't connect to remote host: Connection refused" and this container
      # never becomes healthy. `up -d --wait` then blocks until its timeout and
      # fails the deploy, with a healthcheck that looks obviously correct.
      # Verified 2026-08-06: localhost fails, 127.0.0.1 succeeds, same image.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    image: ${IMAGE_BACKEND}
    container_name: commissionwatch-backend
    restart: unless-stopped
    networks:
      - cw-internal
    mem_limit: 512m
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@commissionwatch-db:5432/${POSTGRES_DB}
      - MINIO_ENDPOINT=commissionwatch-minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-meeting-documents}
      # The origin the sitemap writes into every <loc>. Not a secret, and
      # deliberately without a fallback in code: a sitemap full of
      # http://localhost URLs is not a degraded sitemap, it is a wrong one
      # served with a 200. Unset, /sitemap.xml answers 503 and names this
      # variable. Compose sets an absent variable to the empty string, so the
      # default here is the literal origin rather than :- nothing.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://commissionwatch.bmux.sh}
      # Delivery channels (W7). Encrypts webhook URLs at rest.
      - CHANNEL_SECRET_KEY=${CHANNEL_SECRET_KEY}
      - CI_EVENT_TOKEN=${CI_EVENT_TOKEN}
      # First-operator seed. Without these three the operators table stays
      # empty forever, and since there is deliberately no registration route,
      # /admin/login renders but nobody can ever sign in — the console is
      # deployed and unenterable. seedFirstOperator is a no-op once the table
      # is non-empty, so leaving them set is safe; blank is also safe.
      # Minutes extraction. Absent, the extract route answers 503 and says so —
      # which is the correct default, since this is the one feature that calls
      # a third party. Passed through here because a variable the compose file
      # does not name does not reach the container: OPERATOR_SEED_* was missing
      # for exactly this reason and shipped a console nobody could enter.
      #
      # Free models only, and that is enforced in code — `assertFreeModel`
      # refuses any id without the `:free` suffix, so a mistyped model here
      # fails at construction rather than producing a bill.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - OPERATOR_SEED_EMAIL=${OPERATOR_SEED_EMAIL:-}
      - OPERATOR_SEED_PASSWORD=${OPERATOR_SEED_PASSWORD:-}
      - OPERATOR_SEED_NAME=${OPERATOR_SEED_NAME:-}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, NOT localhost — the same trap that made the web container
      # permanently unhealthy. /etc/hosts in this image maps localhost to ::1 as
      # well, busybox wget tries ::1 first, and the Express server binds IPv4.
      #
      # start_period covers the entrypoint's `knex migrate:latest`, which runs
      # before the server listens. Failures inside start_period do not count
      # against `retries`, so a slow migration cannot fail the deploy — but a
      # crash loop still will, which is the entire point of adding this.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  db:
    image: pgvector/pgvector:pg16
    container_name: commissionwatch-db
    restart: unless-stopped
    networks:
      - cw-internal
    mem_limit: 512m
    # Postgres sizes shared_buffers from total HOST memory, not the container
    # limit, so on a shared 4 GB box it will happily reserve far more than its
    # share. These are set explicitly for that reason.
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=25
      -c effective_cache_size=256MB
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - commissionwatch-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: commissionwatch-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - cw-internal
    mem_limit: 256m
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - commissionwatch-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

networks:
  # Created out-of-band by the platform's bootstrap; shared with Caddy.
  edge:
    external: true
  # Private to this stack. Not the platform's shared `internal` network.
  cw-internal:
    driver: bridge

volumes:
  commissionwatch-pgdata:
  commissionwatch-minio:
