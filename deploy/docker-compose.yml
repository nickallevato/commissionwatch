services:
  backend:
    image: ${IMAGE_BACKEND}
    container_name: commissionwatch-backend
    restart: unless-stopped
    networks:
      - caddy_net
      - internal
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - MINIO_ENDPOINT=commissionwatch-minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-meeting-documents}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    image: ${IMAGE_FRONTEND}
    container_name: commissionwatch-frontend
    restart: unless-stopped
    networks:
      - caddy_net
      - internal
    environment:
      - NODE_ENV=production
      - API_URL=http://commissionwatch-backend:3001

  db:
    image: pgvector/pgvector:pg16
    container_name: commissionwatch-db
    restart: unless-stopped
    networks:
      - internal
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - commissionwatch-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: commissionwatch-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - internal
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - commissionwatch-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  caddy_net:
    external: true
  internal:
    driver: bridge

volumes:
  commissionwatch-pgdata:
  commissionwatch-minio:
