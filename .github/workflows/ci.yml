name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.workspace }}
        run: npm run lint

      - name: Test
        working-directory: ${{ matrix.workspace }}
        run: npm test

  notify-failure:
    needs: lint-and-test
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notify Tracker of CI failure
        env:
          TRACKER_API_KEY: ${{ secrets.TRACKER_API_KEY }}
        run: |
          COMMIT_MSG=$(git log -1 --format=%s)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "Creating Tracker issue..."
          PAYLOAD=$(python3 -c "
          import json, sys
          print(json.dumps({
              'title': 'CI FAILURE: ' + sys.argv[1] + ' - ' + sys.argv[2],
              'description': '## CI Failure\n\n**Job:** lint-and-test\n**Commit:** ' + sys.argv[3] + '\n**Run:** ' + sys.argv[4],
              'priority': 'critical',
              'status': 'todo',
              'projectId': 'REDACTED-PROJECT-ID',
              'assigneeAgentId': 'REDACTED-AGENT-ID'
          }))" "$COMMIT_MSG" "$SHORT_SHA" "${{ github.sha }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://tracker.example.invalid/api/companies/REDACTED-COMPANY-ID/issues" \
            -H "Authorization: Bearer ${TRACKER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "$RESPONSE"
