name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.workspace }}
        run: npm run lint

      - name: Test
        working-directory: ${{ matrix.workspace }}
        run: npm test

  notify-tracker:
    needs: lint-and-test
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notify Tracker of CI failure
        run: bash scripts/ci-notify-tracker.sh "lint-and-test (${{ github.event.pull_request && 'PR' || 'push' }})" "${{ github.sha }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          TRACKER_API_KEY: ${{ secrets.TRACKER_API_KEY }}
