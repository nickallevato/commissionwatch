name: Build and Push to legacy-platform

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.service }}
        run: npm run lint --if-present

      - name: Test
        working-directory: ${{ matrix.service }}
        run: npm test --if-present

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker available
        run: docker info > /dev/null 2>&1 || (echo "ERROR: Docker not available on runner" && exit 1)

      - name: Setup SSH key
        run: |
          set -e
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "ERROR: SSH_PRIVATE_KEY secret is not configured"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan 44.225.151.59 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Open SSH tunnel to registry
        run: |
          set -e
          ssh -fN -o StrictHostKeyChecking=accept-new \
            -L 5000:127.0.0.1:5000 \
            ubuntu@44.225.151.59
          sleep 2
          curl -sf http://localhost:5000/v2/ > /dev/null || echo "WARNING: Registry not reachable via tunnel (may still work for push)"

      - name: Build and push backend
        run: |
          set -e
          docker build -t localhost:5000/commissionwatch-backend:${{ github.sha }} \
                       -t localhost:5000/commissionwatch-backend:latest \
                       ./backend
          docker push localhost:5000/commissionwatch-backend:${{ github.sha }}
          docker push localhost:5000/commissionwatch-backend:latest

      - name: Build and push frontend
        run: |
          set -e
          docker build -t localhost:5000/commissionwatch-frontend:${{ github.sha }} \
                       -t localhost:5000/commissionwatch-frontend:latest \
                       ./frontend
          docker push localhost:5000/commissionwatch-frontend:${{ github.sha }}
          docker push localhost:5000/commissionwatch-frontend:latest

  notify-failure:
    needs: [ci, build-and-push]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notify Tracker of CI failure
        env:
          TRACKER_API_KEY: ${{ secrets.TRACKER_API_KEY }}
        run: |
          COMMIT_MSG=$(git log -1 --format=%s)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "Creating Tracker issue..."
          PAYLOAD=$(python3 -c "
          import json, sys
          print(json.dumps({
              'title': 'CI FAILURE: ' + sys.argv[1] + ' - ' + sys.argv[2],
              'description': '## CI Failure\n\n**Job:** deploy\n**Commit:** ' + sys.argv[3] + '\n**Run:** ' + sys.argv[4],
              'priority': 'critical',
              'status': 'todo',
              'projectId': 'REDACTED-PROJECT-ID',
              'assigneeAgentId': 'REDACTED-AGENT-ID'
          }))" "$COMMIT_MSG" "$SHORT_SHA" "${{ github.sha }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://tracker.example.invalid/api/companies/REDACTED-COMPANY-ID/issues" \
            -H "Authorization: Bearer ${TRACKER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "$RESPONSE"
