name: Build and Push to legacy-platform

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.service }}
        run: npm run lint --if-present

      - name: Test
        working-directory: ${{ matrix.service }}
        run: npm test --if-present

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan 44.225.151.59 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Open SSH tunnel to registry
        run: |
          ssh -fN -o StrictHostKeyChecking=accept-new \
            -L 5000:127.0.0.1:5000 \
            ubuntu@44.225.151.59

      - name: Build and push backend
        run: |
          docker build -t localhost:5000/commissionwatch-backend:${{ github.sha }} \
                       -t localhost:5000/commissionwatch-backend:latest \
                       ./backend
          docker push localhost:5000/commissionwatch-backend:${{ github.sha }}
          docker push localhost:5000/commissionwatch-backend:latest

      - name: Build and push frontend
        run: |
          docker build -t localhost:5000/commissionwatch-frontend:${{ github.sha }} \
                       -t localhost:5000/commissionwatch-frontend:latest \
                       ./frontend
          docker push localhost:5000/commissionwatch-frontend:${{ github.sha }}
          docker push localhost:5000/commissionwatch-frontend:latest

  notify-failure:
    needs: [ci, build-and-push]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch failed job logs
        run: |
          LOG_FILE="/tmp/ci-error.log"
          echo "=== CI Run Logs ===" > "$LOG_FILE"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$LOG_FILE"
          echo "Commit: ${{ github.sha }}" >> "$LOG_FILE"
          echo "" >> "$LOG_FILE"
          curl -s -H "Authorization: token ${{ github.token }}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            | python3 -c "
import sys, json
data = json.load(sys.stdin)
jobs = data if isinstance(data, list) else data.get('jobs', data.get('workflow_jobs', []))
for job in jobs:
    name = job.get('name', 'unknown')
    status = job.get('status', 'unknown')
    conclusion = job.get('conclusion', 'unknown')
    if conclusion in ('failure', 'cancelled', None):
        print(f'--- Job: {name} (status={status}, conclusion={conclusion}) ---')
        for step in job.get('steps', []):
            sname = step.get('name', '')
            sconc = step.get('conclusion', '')
            print(f'  Step: {sname} -> {sconc}')
" >> "$LOG_FILE" 2>&1 || echo "Could not fetch detailed job logs" >> "$LOG_FILE"
          echo "LOG_FILE=$LOG_FILE" >> "$GITHUB_ENV"

      - name: Notify Tracker of CI failure
        run: |
          COMMIT_MSG=$(git log -1 --format=%s)
          bash scripts/ci-notify-tracker.sh "deploy (${{ github.ref_name }})" "${{ github.sha }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "$COMMIT_MSG" "${LOG_FILE:-}"
        env:
          TRACKER_API_KEY: ${{ secrets.TRACKER_API_KEY }}
