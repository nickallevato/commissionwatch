name: Build and Push to legacy-platform

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.service }}
        run: npm run lint --if-present

      - name: Test
        working-directory: ${{ matrix.service }}
        run: npm test --if-present

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan 44.225.151.59 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Open SSH tunnel to registry
        run: |
          ssh -fN -o StrictHostKeyChecking=accept-new \
            -L 5000:127.0.0.1:5000 \
            ubuntu@44.225.151.59

      - name: Build and push backend
        run: |
          docker build -t localhost:5000/commissionwatch-backend:${{ github.sha }} \
                       -t localhost:5000/commissionwatch-backend:latest \
                       ./backend
          docker push localhost:5000/commissionwatch-backend:${{ github.sha }}
          docker push localhost:5000/commissionwatch-backend:latest

      - name: Build and push frontend
        run: |
          docker build -t localhost:5000/commissionwatch-frontend:${{ github.sha }} \
                       -t localhost:5000/commissionwatch-frontend:latest \
                       ./frontend
          docker push localhost:5000/commissionwatch-frontend:${{ github.sha }}
          docker push localhost:5000/commissionwatch-frontend:latest

  notify-failure:
    needs: [ci, build-and-push]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Tracker QA on failure
        run: |
          curl -s -X POST \
            "https://tracker.example.invalid/api/routine-triggers/public/REDACTED-TRIGGER-TOKEN/fire" \
            -H "Content-Type: application/json" \
            -d "{\"project\":\"commissionwatch\",\"repo\":\"your-org/commissionwatch\",\"ref\":\"${{ github.ref }}\",\"sha\":\"${{ github.sha }}\",\"run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
