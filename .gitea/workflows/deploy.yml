name: Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a failed deploy be retried without a dummy commit — the usual
  # reason a deploy fails here is a missing secret, which is fixed in
  # Gitea rather than in the repository.
  workflow_dispatch:

jobs:
  ci-backend:
    runs-on: ubuntu-latest
    # Node comes from the job image rather than actions/setup-node.
    #
    # act_runner caches actions on disk, and a partially-extracted cache entry
    # makes setup-node fail with an lstat error naming a file from the ACTION's
    # own repository (eslint.config.mjs), which reads like a problem in this
    # repo and is not. A pinned image removes the action, the cache, and that
    # whole class of failure.
    container:
      image: node:22-bookworm
    services:
      postgres:
        # pgvector image required: migration 007 runs CREATE EXTENSION vector.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commissionwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d commissionwatch_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      # The database host differs by runner backend, and guessing wrong costs a
      # full red build with a misleading ECONNREFUSED.
      #
      #   GitHub Actions      -> job runs on the VM, service ports are published
      #                          to the host, so the database is at localhost.
      #   Gitea act_runner    -> job runs INSIDE a container on a shared docker
      #   (docker backend)       network, so localhost is the job container
      #                          itself and the database answers to `postgres`.
      #
      # Probe both instead of assuming, and fail with something diagnostic if
      # neither answers.
      - name: Resolve database host
        shell: bash
        run: |
          set -uo pipefail
          for host in postgres localhost 127.0.0.1; do
            for attempt in $(seq 1 15); do
              if (echo > /dev/tcp/"$host"/5432) >/dev/null 2>&1; then
                echo "Postgres reachable at ${host}:5432"
                URL="postgresql://postgres:postgres@${host}:5432/commissionwatch_test"
                echo "DATABASE_URL=${URL}" >> "$GITHUB_ENV"
                echo "TEST_DATABASE_URL=${URL}" >> "$GITHUB_ENV"
                exit 0
              fi
              sleep 2
            done
            echo "no answer from ${host}:5432"
          done
          echo "Postgres unreachable at postgres, localhost and 127.0.0.1 on :5432." >&2
          echo "The service container did not start, or this runner exposes services differently." >&2
          exit 1

      - name: Install dependencies
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee -a /tmp/ci-output.txt

      - name: Typecheck
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee -a /tmp/ci-output.txt

      - name: Lint
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee -a /tmp/ci-output.txt

      - name: Test
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee -a /tmp/ci-output.txt

      - name: Build
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee -a /tmp/ci-output.txt

  ci-frontend:
    runs-on: ubuntu-latest
    # See ci-backend: Node comes from the image, not actions/setup-node.
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee -a /tmp/ci-output.txt

      # --omit=dev: a build-time advisory in a dev dependency (a linter, a test
      # runner) never ships to a reader — it runs on a developer's machine or in
      # this CI container, not in the bundle served at commissionwatch.bmux.sh.
      # Failing the build on that would train everyone to ignore this check.
      # Only what ships to the public SPA counts here.
      #
      # --audit-level=high: moderates don't block. The moderates open as of
      # 2026-08-16 (react-router / @remix-run/router open-redirect class) were
      # fixed by taking the latest 6.x react-router-dom rather than tolerated —
      # this gate is for the next thing that shows up, not an excuse to leave
      # today's known-fixed issues sitting unaddressed. A high or critical
      # advisory in a production dependency should break the build.
      - name: Audit production dependencies
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=high --omit=dev 2>&1 | tee -a /tmp/ci-output.txt

      - name: Typecheck
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee -a /tmp/ci-output.txt

      - name: Lint
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee -a /tmp/ci-output.txt

      - name: Test
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee -a /tmp/ci-output.txt

      - name: Build
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee -a /tmp/ci-output.txt

  # ── Deploy script checks ────────────────────────────────────────────
  # The deploy path cannot be exercised against AWS from CI, but the two parts
  # that break silently can be: the payload SSM receives, and the host-side
  # branch that decides whether the live site keeps running when the instance
  # role cannot read Parameter Store.
  #
  # "No secrets in the SSM payload" is the security property under test.
  # send-command parameters are retained in plaintext for 30 days and land in
  # CloudTrail, readable by anyone in the account with ssm:GetCommandInvocation
  # — on a host shared with seven other products.
  #
  # Same image as the other check jobs, and that is load-bearing:
  # actions/checkout is a JavaScript action, so act_runner needs `node` INSIDE
  # the job container. A python image fails before the first step with
  #   OCI runtime exec failed: exec: "node": executable file not found in $PATH
  # which reads as a broken action rather than a wrong base image.
  #
  # The test therefore uses node and awk, never python — node:22-bookworm ships
  # python3 but not PyYAML, and a test that needs pip install is a test that
  # breaks the first time the network hiccups.
  ci-deploy-script:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Test the SSM deploy script
        shell: bash
        run: |
          set -o pipefail
          bash ./deploy/test-deploy-aws-ssm.sh 2>&1 | tee -a /tmp/ci-output.txt

      # The external monitor's clock. It is the only thing between a monitor
      # that runs and one that sits registered and never fires — the state this
      # repository was actually in, because scheduled workflows do not execute
      # on this Gitea. Everything it does is driven against a stub curl, so this
      # needs no token and makes no request.
      - name: Test the external monitor trigger
        shell: bash
        run: |
          set -o pipefail
          bash ./deploy/test-monitor-trigger.sh 2>&1 | tee -a /tmp/ci-output.txt

  # ── Build and push images to ECR ────────────────────────────────────
  # The old self-hosted runner and its SSH-tunnelled localhost:5000 registry are
  # both gone. Images now go to ECR in the account named by the AWS_ACCOUNT_ID
  # repository variable, which the shared platform host pulls from with its
  # instance role.
  #
  # CRITICAL: --platform linux/arm64. The platform host is a t4g.medium, which
  # is Graviton. An amd64 image builds perfectly in CI and then dies on the host
  # with "exec format error", which reads like a broken image rather than a
  # wrong architecture.
  build-and-push:
    needs: [ci-backend, ci-frontend, ci-deploy-script]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: dh1
    env:
      # Account, region and namespace are Gitea repository VARIABLES, not
      # secrets and not literals. They are identifiers rather than credentials,
      # but this repository is public and an account number beside an instance
      # id is a free inventory.
      #
      # ⚠ An unset variable here does NOT render as "". This Gitea's expression
      # evaluator substitutes a literal variable NAME — and not reliably the one
      # you asked for. Run 28290: `${{ vars.AWS_REGION }}` became the string
      # `AWS_REGION`, making ECR_REGISTRY `AWS_REGION.dkr.ecr.AWS_REGION…`.
      # Run 28306: `${{ vars.AWS_ACCOUNT_ID }}` ALSO arrived as `AWS_REGION`.
      # So the value cannot be trusted to identify even which variable it came
      # from, which is why each is checked against its own expected shape.
      # An emptiness check therefore passes and the build dies much later on
      # `Provided region_name 'AWS_REGION' doesn't match a supported format`.
      # The preflight in "Log in to ECR" checks shape, not emptiness, for
      # exactly that reason. AWS_ACCOUNT_ID is passed separately so it can be
      # checked on its own rather than inferred from the composed registry.
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
      ECR_NAMESPACE: ${{ vars.ECR_NAMESPACE }}
      # AWS CLI v2 pages output through less(1). On a runner TERM is
      # undriveable, so every aws call stalls on "Press RETURN" rather than
      # failing — the step looks merely slow until something times out.
      AWS_PAGER: ""
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ECR
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail
          {
            # Preflight the repository variables by SHAPE, not by emptiness.
            #
            # An unset variable does not arrive empty here — this Gitea renders
            # `${{ vars.AWS_REGION }}` as the literal string `AWS_REGION`, so
            # `[ -n "$AWS_REGION" ]` is satisfied by the very thing it was
            # meant to catch. That cost run 28290 a red build whose only
            # symptom was an AWS CLI complaint about a region name, six steps
            # from the actual cause.
            #
            # Each check below would also reject a genuinely malformed value,
            # which is the point: a fork hits this on its first push, and the
            # message names the variable rather than the symptom.
            bad=""
            case "$AWS_ACCOUNT_ID" in
              [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
              *) bad="$bad AWS_ACCOUNT_ID(12 digits)" ;;
            esac
            case "$AWS_REGION" in
              [a-z][a-z]-*-[0-9]) ;;
              *) bad="$bad AWS_REGION(shape xx-name-N)" ;;
            esac
            case "$ECR_NAMESPACE" in
              ""|ECR_NAMESPACE|*[!a-z0-9._/-]*) bad="$bad ECR_NAMESPACE" ;;
            esac
            if [ -n "$bad" ]; then
              echo "Gitea repository variable(s) unset or malformed:$bad" >&2
              echo "Got: AWS_ACCOUNT_ID='$AWS_ACCOUNT_ID' AWS_REGION='$AWS_REGION' ECR_NAMESPACE='$ECR_NAMESPACE'" >&2
              echo "An unset variable arrives as its own NAME here, not as empty." >&2
              echo "Set them under Settings → Actions → Variables. See deploy/deployment.env.example." >&2
              exit 1
            fi
            if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
              echo "AWS_ACCESS_KEY_ID not set; cannot push to ECR." >&2
              exit 1
            fi
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          } 2>&1 | tee -a /tmp/ci-output.txt

      # The `your-org/` prefix is REQUIRED and is not cosmetic. The CI user's
      # inline policy grants push only on
      #   arn:aws:ecr:<region>:<account>:repository/<namespace>/commissionwatch-*
      # so an unprefixed path is denied no matter what else is correct.
      #
      # Repositories are provisioned out of band on purpose: a build pipeline
      # should push to known repositories, not create arbitrary ones, so these
      # credentials deliberately lack ecr:CreateRepository.
      #
      # Both failure modes — wrong path and missing repository — surface as
      # `403 Forbidden` on a blob HEAD request rather than a 404, and the
      # message never names the repository. If a push 403s, check the image
      # path and the repository's existence before suspecting the credentials.
      - name: Set up buildx for cross-architecture builds
        shell: bash
        run: |
          set -o pipefail
          {
            docker run --privileged --rm tonistiigi/binfmt --install arm64 || true
            docker buildx create --name cwbuilder --use 2>/dev/null || docker buildx use cwbuilder
            docker buildx inspect --bootstrap
          } 2>&1 | tee -a /tmp/ci-output.txt

      # BUILD_SHA is baked into both images and served by GET /api/version and
      # GET /version.json. The deploy compares the two: the images roll
      # independently, so a stack serving the old API behind the new UI is
      # perfectly healthy from the outside and otherwise invisible.
      #
      # Both images are stamped with the SAME value from one shell expansion,
      # so a mismatch can only mean a genuinely skewed deploy.
      - name: Stamp the build identifiers
        shell: bash
        run: |
          set -o pipefail
          {
            echo "BUILD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
            echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          } 2>&1 | tee -a /tmp/ci-output.txt

      - name: Build and push backend (arm64)
        shell: bash
        run: |
          set -o pipefail
          {
            docker buildx build --platform linux/arm64 --push \
              --build-arg "BUILD_SHA=$BUILD_SHA" \
              --build-arg "BUILD_TIME=$BUILD_TIME" \
              -t "$ECR_REGISTRY/$ECR_NAMESPACE/commissionwatch-backend:${{ github.sha }}" \
              -t "$ECR_REGISTRY/$ECR_NAMESPACE/commissionwatch-backend:latest" \
              ./backend
          } 2>&1 | tee -a /tmp/ci-output.txt

      - name: Build and push frontend (arm64)
        shell: bash
        run: |
          set -o pipefail
          {
            docker buildx build --platform linux/arm64 --push \
              --build-arg "BUILD_SHA=$BUILD_SHA" \
              --build-arg "BUILD_TIME=$BUILD_TIME" \
              -t "$ECR_REGISTRY/$ECR_NAMESPACE/commissionwatch-frontend:${{ github.sha }}" \
              -t "$ECR_REGISTRY/$ECR_NAMESPACE/commissionwatch-frontend:latest" \
              ./frontend
          } 2>&1 | tee -a /tmp/ci-output.txt

  # ── Deploy to the shared bmux.sh platform, over SSM ──────────────────
  # This job used to open with "Configure SSH", and it never once ran green.
  # It could not: the host is your-org/platform-aws, shared across products,
  # and its SSH key pair belongs to whoever provisioned it. EC2 stores only the
  # key pair's NAME — the private half is not retrievable from AWS by anybody.
  # Port 22 being open made that look like a missing secret rather than a
  # missing capability, which is how a lot of time went into sourcing a key
  # that was never going to be handed out.
  #
  # SSM Run Command needs neither a key nor a host address. It addresses the
  # instance by id, executes through the instance's own SSM agent, and the host
  # pulls from ECR with its instance role.
  #
  # The deploy itself lives in deploy/deploy-aws-ssm.sh rather than here, so
  # that the manual path and the automated path are the same code. When the
  # pipeline is blocked — which is where every product on this host starts —
  # the operator runs that script by hand with identical arguments.
  #
  # Gated on SHARED_STACK_LIVE so the job is inert until the operator opts in,
  # matching every other product on the shared stack.
  deploy-aws:
    needs: build-and-push
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.SHARED_STACK_LIVE == 'true'
    runs-on: dh1
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
      ECR_NAMESPACE: ${{ vars.ECR_NAMESPACE }}
      # See build-and-push: without this every aws call hangs on less(1).
      AWS_PAGER: ""
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSM Run Command
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Optional. When set, the script refreshes the SecureString in
          # Parameter Store before deploying; when absent, the deploy reuses
          # whatever the parameter already holds. That is deliberate — a code
          # deploy should not require the credentials secret to be present.
          DEPLOY_ENV_FILE_AWS: ${{ secrets.DEPLOY_ENV_FILE_AWS }}
        run: |
          set -o pipefail
          {
            set -euo pipefail

            # Trap 2: an absent Gitea secret renders as "", not as unset, and
            # every aws call then fails with something that reads like an auth
            # or network problem. Trap 1 is why it is usually empty:
            # ORGANISATION secrets are NOT inherited by repositories.
            if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
              echo "FATAL: AWS credentials are empty in this repository's scope." >&2
              echo "Gitea organisation secrets are not inherited. Add AWS_ACCESS_KEY_ID" >&2
              echo "and AWS_SECRET_ACCESS_KEY under Settings -> Actions -> Secrets on" >&2
              echo "THIS REPOSITORY." >&2
              exit 1
            fi

            # Variables, unlike secrets, arrive as their own NAME when unset —
            # see the note on this job's env block. So this is a shape check,
            # and INSTANCE_ID gets one because sending a command to a
            # nonexistent instance id is the failure that reads least like its
            # cause: SSM answers InvalidInstanceId whether the id is malformed,
            # belongs to another account, or simply has no agent running.
            case "$INSTANCE_ID" in
              i-[0-9a-f]*) ;;
              *) echo "FATAL: INSTANCE_ID is unset or malformed: '$INSTANCE_ID'" >&2
                 echo "Expected i-0123456789abcdef0. An unset Gitea variable arrives" >&2
                 echo "as its own name, not as empty. Settings -> Actions -> Variables." >&2
                 exit 1 ;;
            esac

            TMPENV=""
            # `[ -n "$X" ] && rm ...` as the LAST command of an EXIT trap sets
            # the script's exit status when the test fails, so an entirely
            # successful deploy exited 1 whenever TMPENV was empty — i.e. on
            # exactly the path where DEPLOY_ENV_FILE_AWS is unset, which is the
            # normal one. `if` with no else always returns 0.
            cleanup() { if [ -n "$TMPENV" ]; then rm -f "$TMPENV"; fi; }
            trap cleanup EXIT

            if [ -n "${DEPLOY_ENV_FILE_AWS:-}" ]; then
              umask 077
              TMPENV="$(mktemp)"
              printf '%s\n' "$DEPLOY_ENV_FILE_AWS" > "$TMPENV"
              export DEPLOY_ENV_FILE="$TMPENV"
              echo "will refresh the SecureString in Parameter Store"
            else
              echo "DEPLOY_ENV_FILE_AWS not set; reusing the existing Parameter Store value"
            fi

            # Pinned to this commit, so a deploy is reproducible and a rollback
            # is the same script with an older tag.
            export IMAGE_BACKEND="$ECR_REGISTRY/$ECR_NAMESPACE/commissionwatch-backend:${{ github.sha }}"
            export IMAGE_FRONTEND="$ECR_REGISTRY/$ECR_NAMESPACE/commissionwatch-frontend:${{ github.sha }}"

            # Makes the deploy assert that both containers actually came up
            # serving THIS commit, rather than only that they came up.
            export EXPECT_SHA="${{ github.sha }}"

            bash ./deploy/deploy-aws-ssm.sh
          } 2>&1 | tee -a /tmp/ci-output.txt

      - name: Verify the site responds
        shell: bash
        run: |
          set -o pipefail
          {
            # Proves the container is actually serving, not merely running.
            # A 502 here means Caddy is routing but the app is not up; a TLS
            # failure means the shared Caddy has no site block for this host yet.
            for i in 1 2 3 4 5 6; do
              CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
                https://commissionwatch.bmux.sh/api/health || echo "000")
              echo "attempt $i: http=$CODE"
              [ "$CODE" = "200" ] && exit 0
              sleep 10
            done
            echo "Site did not return 200 after 6 attempts." >&2
            exit 1
          } 2>&1 | tee -a /tmp/ci-output.txt

      # ── The external monitor, run against what was just deployed ────────
      # The step above proves /api/health answers 200. That is not the same as
      # the deploy being right, and the gap between the two is where last
      # night's incident lived: the images roll independently, so a stack
      # serving the old API behind the new UI returns 200 from both and is
      # invisible from outside.
      #
      # This is the SAME script the scheduled monitor runs — one evaluation,
      # tested in backend/test/external-monitor.test.ts, not a second opinion
      # written in shell. It checks the database is connected, that
      # /api/version and /version.json agree on the sha, and that no enabled
      # ingestion source is past its expected interval.
      #
      # It runs here because scheduled workflows do not currently fire on this
      # Gitea instance — see .gitea/workflows/monitor.yml, where the evidence
      # is recorded. A deploy is not a substitute for a periodic probe and is
      # not offered as one; it is the trigger that exists today, aimed at the
      # failure that actually happened.
      #
      # MONITOR_EXPECTED_SHA is this pipeline's own commit: after deploy-aws has
      # reported success, the site must be serving it. The allowance is dropped
      # to zero here on purpose — the minutes of drift that are normal between a
      # push and a finished build have already elapsed by this point in the run,
      # so anything other than this commit being live is a release that did not
      # land, not one in flight. The periodic monitor keeps the 30-minute
      # default, where in-flight is the common case.
      #
      # A zero allowance would race the step above, which exits on the FIRST 200
      # from /api/health — and that 200 can be answered by the old container
      # while the compose swap is still finishing. The monitor closes that race
      # itself: a mismatched sha is re-read a bounded number of times before it
      # is believed (MONITOR_SETTLE_ATTEMPTS / MONITOR_SETTLE_DELAY_MS, three
      # reads ten seconds apart by default), and the message says how many reads
      # it took, so a settled deploy is distinguishable in the log from a
      # first-read match. Raising the allowance instead cannot work: drift is
      # aged from the COMMIT time, already ~12 minutes old by now.
      #
      # The same settle now covers the `version` check, which compares
      # /api/version against /version.json. The two images roll independently, so
      # a probe landing mid-swap can catch one rolled and the other not — a
      # convincing "half-finished rollout" that is a deploy in progress. Both
      # checks read one settle policy, so they cannot disagree about it.
      #
      # A mid-swap run can therefore pay the settle twice, up to 60s, and only
      # ever on a mismatch. They deliberately do not share a probe: sharing one
      # read between two checks is how one check's absence becomes the other's
      # claim.
      - name: Probe the deployment with the external monitor
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MONITOR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MONITOR_EXPECTED_SHA: ${{ github.sha }}
          MONITOR_MAX_DRIFT_MINUTES: "0"
        run: |
          set -o pipefail
          {
            # The commit time comes from the checkout: the probe runs in a stock
            # node:22 container where git is not guaranteed. Empty makes the
            # release-drift check report BLOCKED, never PASS.
            MONITOR_EXPECTED_SHA_TIME="$(git log -1 --format=%cI ${{ github.sha }} 2>/dev/null || true)"
            export MONITOR_EXPECTED_SHA_TIME
            docker run --rm \
              -v "$(pwd):/workspace" -w /workspace \
              -e DISCORD_WEBHOOK_URL \
              -e MONITOR_RUN_URL \
              -e MONITOR_EXPECTED_SHA \
              -e MONITOR_EXPECTED_SHA_TIME \
              -e MONITOR_MAX_DRIFT_MINUTES \
              node:22-bookworm \
              node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON \
                backend/src/scripts/external-monitor.ts --run
          } 2>&1 | tee -a /tmp/ci-output.txt
