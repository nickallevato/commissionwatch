name: Build and Push to legacy-platform

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee -a /tmp/ci-output.txt

      - name: Lint
        working-directory: ${{ matrix.service }}
        shell: bash
        run: |
          set -o pipefail
          npm run lint --if-present 2>&1 | tee -a /tmp/ci-output.txt

      - name: Test
        working-directory: ${{ matrix.service }}
        shell: bash
        run: |
          set -o pipefail
          npm test --if-present 2>&1 | tee -a /tmp/ci-output.txt

      # ── Notify Tracker on failure ─────────────────────────────────────
      # Creates a Tracker triage issue when any prior step fails.
      # Required Gitea secret: TRACKER_API_KEY
      - name: Notify Tracker of CI failure
        if: failure()
        env:
          TRACKER_API_KEY: ${{ secrets.TRACKER_API_KEY }}
          GH_SHA: ${{ github.sha }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_REPOSITORY: ${{ github.repository }}
          JOB_LABEL: ci ${{ matrix.service }}
        run: |
          set +e  # notification must never fail the build
          API_KEY="$(printf '%s' "$TRACKER_API_KEY" | tr -d '[:space:]')"

          if [ -z "$API_KEY" ]; then
            echo "TRACKER_API_KEY not set — skipping failure notification"
            exit 0
          fi

          SHORT_SHA="${GH_SHA:0:7}"
          RUN_URL="${GH_SERVER_URL}/${GH_REPOSITORY}/actions/runs/${GH_RUN_ID}"
          COMMIT_URL="${GH_SERVER_URL}/${GH_REPOSITORY}/commit/${GH_SHA}"

          # Capture last ~80 lines of CI output (tee'd by earlier steps), capped to 4KB
          LOG_FILE="/tmp/ci-output.txt"
          LOG_TAIL_FILE="/tmp/ci-output.tail"
          if [ -f "$LOG_FILE" ]; then
            tail -n 80 "$LOG_FILE" | tail -c 4000 > "$LOG_TAIL_FILE"
          else
            echo "(no captured CI output found at $LOG_FILE)" > "$LOG_TAIL_FILE"
          fi

          PAYLOAD=$(jq -n \
            --arg title "CI Failure: ${JOB_LABEL} @ ${SHORT_SHA}" \
            --arg runUrl "$RUN_URL" \
            --arg commitUrl "$COMMIT_URL" \
            --arg sha "$SHORT_SHA" \
            --arg branch "$GH_REF_NAME" \
            --arg job "$JOB_LABEL" \
            --rawfile logTail "$LOG_TAIL_FILE" \
            '{
              title: $title,
              status: "todo",
              priority: "critical",
              projectId: "REDACTED-PROJECT-ID",
              assigneeAgentId: "REDACTED-AGENT-ID",
              description: ("CI failed on `" + $branch + "` @ " + $sha + " (" + $job + ")\n\nRun: " + $runUrl + "\nCommit: " + $commitUrl + "\n\n--- last log lines ---\n\n```\n" + $logTail + "\n```")
            }') || { echo "WARNING: jq failed — skipping Tracker notification"; exit 0; }

          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://tracker.example.invalid/api/companies/REDACTED-COMPANY-ID/issues" \
            -H "Authorization: Bearer ${API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          CURL_EXIT=$?
          HTTP_BODY=$(echo "$HTTP_RESPONSE" | head -n -1)
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n 1)
          if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ] 2>/dev/null; then
            echo "WARNING: Failed to create Tracker failure ticket (curl=$CURL_EXIT, http=$HTTP_CODE, body=$HTTP_BODY)"
          else
            echo "Tracker failure ticket created: HTTP $HTTP_CODE"
          fi
          exit 0

  build-and-push:
    needs: ci
    # Run on the host runner as user `daedalus` so we use daedalus's existing
    # SSH key/known_hosts on ai2 — no need to inject SSH_PRIVATE_KEY into a
    # container as root.
    runs-on: ai2-daedalus
    steps:
      - uses: actions/checkout@v4

      - name: Open SSH tunnel to registry
        shell: bash
        env:
          TUNNEL_SOCK: /tmp/legacy-platform-tunnel-${{ github.run_id }}.sock
        run: |
          set -o pipefail
          {
            ssh-keyscan 44.225.151.59 >> ~/.ssh/known_hosts 2>/dev/null || true
            ssh -fN -M -S "$TUNNEL_SOCK" \
              -o StrictHostKeyChecking=accept-new \
              -L 5000:127.0.0.1:5000 \
              ubuntu@44.225.151.59
          } 2>&1 | tee -a /tmp/ci-output.txt

      - name: Build and push backend
        shell: bash
        run: |
          set -o pipefail
          {
            docker build -t localhost:5000/commissionwatch-backend:${{ github.sha }} \
                         -t localhost:5000/commissionwatch-backend:latest \
                         ./backend
            docker push localhost:5000/commissionwatch-backend:${{ github.sha }}
            docker push localhost:5000/commissionwatch-backend:latest
          } 2>&1 | tee -a /tmp/ci-output.txt

      - name: Build and push frontend
        shell: bash
        run: |
          set -o pipefail
          {
            docker build -t localhost:5000/commissionwatch-frontend:${{ github.sha }} \
                         -t localhost:5000/commissionwatch-frontend:latest \
                         ./frontend
            docker push localhost:5000/commissionwatch-frontend:${{ github.sha }}
            docker push localhost:5000/commissionwatch-frontend:latest
          } 2>&1 | tee -a /tmp/ci-output.txt

      - name: Close SSH tunnel
        if: always()
        shell: bash
        env:
          TUNNEL_SOCK: /tmp/legacy-platform-tunnel-${{ github.run_id }}.sock
        run: |
          if [ -S "$TUNNEL_SOCK" ]; then
            ssh -S "$TUNNEL_SOCK" -O exit ubuntu@44.225.151.59 2>&1 || true
          fi

      # ── Notify Tracker on failure ─────────────────────────────────────
      # Creates a Tracker triage issue when any prior step fails.
      # Required Gitea secret: TRACKER_API_KEY
      - name: Notify Tracker of build failure
        if: failure()
        env:
          TRACKER_API_KEY: ${{ secrets.TRACKER_API_KEY }}
          GH_SHA: ${{ github.sha }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_REPOSITORY: ${{ github.repository }}
          JOB_LABEL: build-and-push
        run: |
          set +e  # notification must never fail the build
          API_KEY="$(printf '%s' "$TRACKER_API_KEY" | tr -d '[:space:]')"

          if [ -z "$API_KEY" ]; then
            echo "TRACKER_API_KEY not set — skipping failure notification"
            exit 0
          fi

          SHORT_SHA="${GH_SHA:0:7}"
          RUN_URL="${GH_SERVER_URL}/${GH_REPOSITORY}/actions/runs/${GH_RUN_ID}"
          COMMIT_URL="${GH_SERVER_URL}/${GH_REPOSITORY}/commit/${GH_SHA}"

          # Capture last ~80 lines of build output (tee'd by earlier steps), capped to 4KB
          LOG_FILE="/tmp/ci-output.txt"
          LOG_TAIL_FILE="/tmp/ci-output.tail"
          if [ -f "$LOG_FILE" ]; then
            tail -n 80 "$LOG_FILE" | tail -c 4000 > "$LOG_TAIL_FILE"
          else
            echo "(no captured build output found at $LOG_FILE)" > "$LOG_TAIL_FILE"
          fi

          PAYLOAD=$(jq -n \
            --arg title "Build Failure: ${JOB_LABEL} @ ${SHORT_SHA}" \
            --arg runUrl "$RUN_URL" \
            --arg commitUrl "$COMMIT_URL" \
            --arg sha "$SHORT_SHA" \
            --arg branch "$GH_REF_NAME" \
            --arg job "$JOB_LABEL" \
            --rawfile logTail "$LOG_TAIL_FILE" \
            '{
              title: $title,
              status: "todo",
              priority: "critical",
              projectId: "REDACTED-PROJECT-ID",
              assigneeAgentId: "REDACTED-AGENT-ID",
              description: ("Build failed on `" + $branch + "` @ " + $sha + " (" + $job + ")\n\nRun: " + $runUrl + "\nCommit: " + $commitUrl + "\n\n--- last log lines ---\n\n```\n" + $logTail + "\n```")
            }') || { echo "WARNING: jq failed — skipping Tracker notification"; exit 0; }

          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://tracker.example.invalid/api/companies/REDACTED-COMPANY-ID/issues" \
            -H "Authorization: Bearer ${API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          CURL_EXIT=$?
          HTTP_BODY=$(echo "$HTTP_RESPONSE" | head -n -1)
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n 1)
          if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ] 2>/dev/null; then
            echo "WARNING: Failed to create Tracker failure ticket (curl=$CURL_EXIT, http=$HTTP_CODE, body=$HTTP_BODY)"
          else
            echo "Tracker failure ticket created: HTTP $HTTP_CODE"
          fi
          exit 0

  deploy-ai2:
    needs: build-and-push
    runs-on: ai2-daedalus
    steps:
      - uses: actions/checkout@v4

      - name: Deploy commissionwatch on ai2
        shell: bash
        env:
          IMAGE_BACKEND: localhost:5000/commissionwatch-backend:${{ github.sha }}
          IMAGE_FRONTEND: localhost:5000/commissionwatch-frontend:${{ github.sha }}
          POSTGRES_USER: commwatch
          POSTGRES_PASSWORD: commwatch
          POSTGRES_DB: commwatch
          DATABASE_URL: postgres://commwatch:commwatch@commissionwatch-db:5432/commwatch
        run: |
          set -o pipefail
          {
            # deploy/docker-compose.yml declares caddy_net as external; create
            # it on first run so compose doesn't error.
            docker network inspect caddy_net >/dev/null 2>&1 \
              || docker network create caddy_net

            cd deploy
            docker compose -p commissionwatch -f docker-compose.yml -f docker-compose.ai2.yml up -d
            docker compose -p commissionwatch -f docker-compose.yml -f docker-compose.ai2.yml ps
          } 2>&1 | tee -a /tmp/ci-output.txt

      # ── Notify Tracker on failure ─────────────────────────────────────
      # Creates a Tracker triage issue when any prior step fails.
      # Required Gitea secret: TRACKER_API_KEY
      - name: Notify Tracker of deploy failure
        if: failure()
        env:
          TRACKER_API_KEY: ${{ secrets.TRACKER_API_KEY }}
          GH_SHA: ${{ github.sha }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_REPOSITORY: ${{ github.repository }}
          JOB_LABEL: deploy-ai2
        run: |
          set +e  # notification must never fail the build
          API_KEY="$(printf '%s' "$TRACKER_API_KEY" | tr -d '[:space:]')"

          if [ -z "$API_KEY" ]; then
            echo "TRACKER_API_KEY not set — skipping failure notification"
            exit 0
          fi

          SHORT_SHA="${GH_SHA:0:7}"
          RUN_URL="${GH_SERVER_URL}/${GH_REPOSITORY}/actions/runs/${GH_RUN_ID}"
          COMMIT_URL="${GH_SERVER_URL}/${GH_REPOSITORY}/commit/${GH_SHA}"

          # Capture last ~80 lines of deploy output (tee'd by earlier steps), capped to 4KB
          LOG_FILE="/tmp/ci-output.txt"
          LOG_TAIL_FILE="/tmp/ci-output.tail"
          if [ -f "$LOG_FILE" ]; then
            tail -n 80 "$LOG_FILE" | tail -c 4000 > "$LOG_TAIL_FILE"
          else
            echo "(no captured deploy output found at $LOG_FILE)" > "$LOG_TAIL_FILE"
          fi

          PAYLOAD=$(jq -n \
            --arg title "Deploy Failure: ${JOB_LABEL} @ ${SHORT_SHA}" \
            --arg runUrl "$RUN_URL" \
            --arg commitUrl "$COMMIT_URL" \
            --arg sha "$SHORT_SHA" \
            --arg branch "$GH_REF_NAME" \
            --arg job "$JOB_LABEL" \
            --rawfile logTail "$LOG_TAIL_FILE" \
            '{
              title: $title,
              status: "todo",
              priority: "critical",
              projectId: "REDACTED-PROJECT-ID",
              assigneeAgentId: "REDACTED-AGENT-ID",
              description: ("Deploy failed on `" + $branch + "` @ " + $sha + " (" + $job + ")\n\nRun: " + $runUrl + "\nCommit: " + $commitUrl + "\n\n--- last log lines ---\n\n```\n" + $logTail + "\n```")
            }') || { echo "WARNING: jq failed — skipping Tracker notification"; exit 0; }

          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://tracker.example.invalid/api/companies/REDACTED-COMPANY-ID/issues" \
            -H "Authorization: Bearer ${API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          CURL_EXIT=$?
          HTTP_BODY=$(echo "$HTTP_RESPONSE" | head -n -1)
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n 1)
          if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ] 2>/dev/null; then
            echo "WARNING: Failed to create Tracker failure ticket (curl=$CURL_EXIT, http=$HTTP_CODE, body=$HTTP_BODY)"
          else
            echo "Tracker failure ticket created: HTTP $HTTP_CODE"
          fi
          exit 0
