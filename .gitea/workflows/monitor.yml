name: External monitor

# Uptime, deploy skew and ingestion staleness, judged from outside the
# application.
#
# WHY THIS IS NOT IN THE APP. On 2026-08-09 production returned 502 on every
# /api/* route for about four hours and the only reason anyone found out was a
# person opening the site. Everything this codebase says about its own health —
# the masthead's sweep clock, /admin/sources, /status — is served by the process
# that was down. A watch inside the process can only report while the process is
# alive, which is exactly when it has nothing to report.
#
# WHY A FAILING RUN IS THE ALERT. A red scheduled run sits in Gitea's run list
# until somebody deals with it. A warning in a green run's log is gone the moment
# it scrolls.
#
# Design and the probes that grounded it:
#   docs/superpowers/plans/2026-08-10-external-monitoring.md

on:
  # ⚠ THE SCHEDULE DOES NOT FIRE ON THIS GITEA. Measured, not assumed.
  #
  # The instance is 1.25.5, which is well past the 1.20 that introduced
  # scheduled workflows, so the feature exists in the software. It does not
  # execute here. What was checked, on 2026-08-10:
  #
  #   · This workflow landed on the default branch at 04:16 UTC and shows
  #     `state: active` in GET /actions/workflows. The 04:30 and 04:45 ticks
  #     both passed with no run.
  #   · Across all 82 repositories on gitea.example.invalid, EIGHT workflows declare
  #     a cron schedule and the number of runs ever triggered by `schedule` is
  #     ZERO. `na/minobi`'s watchdog asks for `*/5 * * * *` and has 20,493 runs,
  #     every one of them a push.
  #   · `workflow_dispatch` and `workflow_run` both fire normally, so this is
  #     the scheduler specifically, not Actions.
  #
  # The likely cause is the instance's cron being off in app.ini, which is an
  # operator change on the Gitea host and not something this repository can
  # make. It is worth making: it would light up eight workflows at once,
  # including a watchdog somebody believes is already watching.
  #
  # The declaration stays because it is correct, costs nothing, and starts
  # working the day the instance does. It is NOT what this monitor currently
  # relies on — see below.
  schedule:
    - cron: "*/15 * * * *"
  # This is the trigger that works, and it is proven: run 26478 on 2026-08-10
  # probed production green from a dispatch. Anything that can hold a token can
  # drive it on whatever interval the operator trusts —
  #
  #   curl -X POST -H "Authorization: token $GITEA_TOKEN" \
  #        -H "Content-Type: application/json" -d '{"ref":"main"}' \
  #        "$GITEA_URL/api/v1/repos/your-org/commissionwatch/actions/workflows/monitor.yml/dispatches"
  #
  # — which answers 204.
  #
  # THAT REQUEST NOW HAS A HOME: `deploy/monitor-trigger.sh`, committed, tested
  # against a stub curl (36 assertions), and meant to be run from cron on an
  # always-on machine. It holds no token — the token comes from the environment
  # or from ~/.config/commissionwatch/gitea.env, which is not in this
  # repository. It also reads back how long it has been since a monitor run and
  # fails when that gap is past its allowance, so a clock that was stopped
  # reports the gap on the tick that restarts it.
  #
  # **Installing that cron entry is an operator action and it has not been
  # done.** The exact command is in docs/STATUS.md. Until it is, deploy.yml runs
  # the identical probe after every deploy, which is aimed at the failure that
  # actually happened but is not a periodic check and is not offered as one.
  #
  # And if the clock itself stops, nothing notices. That is a dead-man's-switch,
  # it needs a third party outside both this repository and Gitea, and it is not
  # built — named in docs/STATUS.md rather than left implicit.
  workflow_dispatch:

jobs:
  probe:
    # dh1, and this is not interchangeable. The live site is gated at the Caddy
    # layer to a single address, and dh1 is the ONLY runner proven to get
    # through it: deploy.yml's "Verify the site responds" step has answered
    # `attempt 1: http=200` from this label. `ubuntu-latest` has never made an
    # outbound request to the site, so its egress address is unproven, and a
    # monitor that is red from its first run because of its own network position
    # is a monitor people learn to mute.
    runs-on: dh1
    steps:
      - uses: actions/checkout@v4

      # One dependency-free TypeScript file, run by a stock Node image. Node 22
      # strips types natively, so there is no npm install, no lockfile and no
      # build — deliberately: a monitor whose green run depends on the npm
      # registry being reachable goes red for reasons that have nothing to do
      # with the site it watches.
      #
      # docker is used rather than a `container:` block because this runner
      # already builds images with it, so it is proven present rather than
      # hoped for, and pinning the image pins the Node version.
      #
      # The webhook arrives in the environment, never in the argument list.
      - name: Probe the live site
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MONITOR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$(pwd):/workspace" -w /workspace \
            -e DISCORD_WEBHOOK_URL \
            -e MONITOR_RUN_URL \
            node:22-bookworm \
            node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON \
              backend/src/scripts/external-monitor.ts --run

      # Deliberately no issue-tracker step, and no POST to /api/internal/events.
      #
      # The application's own delivery routing is out because a deploy that
      # broke the backend is exactly when the backend cannot be trusted to say
      # the deploy broke it — the fallback reasoning in
      # docs/superpowers/specs/2026-08-04-delivery-channels-design.md
      # § "Transport, and why CI has a fallback", taken to its conclusion. The
      # script posts straight to DISCORD_WEBHOOK_URL when that secret is
      # configured, and says in the message that it bypassed routing.
      #
      # Ticket filing is out for a duller reason: a four-hour outage would file
      # sixteen identical tickets. The failed run is the durable signal.
