server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # nginx resolves a LITERAL proxy_pass hostname once, at config-parse
        # time, and exits if it does not resolve — it does not retry. With
        # `proxy_pass http://backend:3001;` this container dies at startup with
        #   [emerg] host not found in upstream "backend"
        # whenever it starts before the backend exists in DNS. That was observed
        # on the first production deploy: it crash-looped until the backend
        # finished starting, and only recovered because restart: unless-stopped
        # kept trying, which is luck rather than design.
        #
        # A VARIABLE upstream defers resolution to request time, so nginx starts
        # cleanly and the first few requests fail instead of the whole server.
        # The resolver is Docker's embedded DNS, which exists on user-defined
        # networks (cw-internal) but not on the default bridge.
        #
        # The variable deliberately carries no URI part: nginx only replaces the
        # request URI when the directive specifies one, so the original path —
        # including the /api/ prefix the backend routes on — is passed through
        # unchanged, exactly as the literal form did.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://backend:3001;
        # Must match the backend's listen port (backend/src/index.ts: PORT || 3001).
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
