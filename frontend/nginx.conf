# Who gets the prerendered copy, and why it is not everybody.
#
# The backend's prerender consumer writes a self-contained HTML document per
# public record into a shared volume, mounted read-only at
# /usr/share/nginx/html/_prerender (deploy/docker-compose.shared.yml). Those
# documents deliberately load NO stylesheet and NO script — see the header of
# backend/src/services/prerender/document.ts: the SPA bundle's filename is a
# hashed artifact of the *frontend* image and is not knowable from the backend,
# so a <script src> written there would be a guess, and a wrong guess is a 404
# on every prerendered page.
#
# That is the whole decision. Serving those files from `location /`
# unconditionally would replace the React application with a bare, unstyled
# document for every HUMAN reader of /meetings/{id}, /findings/{id},
# /officials/{id}, /source/{sha} and /data. Every interactive thing this site
# has — search, the agenda diff timeline, the calendar, the vote bars, the
# citation viewer — would simply stop existing on exactly the pages that matter
# most. That is a large, immediate, certain regression traded against an
# indexing win, and the trade is not close.
#
# So: known crawlers and link unfurlers get the prerendered document; browsers
# get the SPA, which renders the same records from the same database over
# /api/. This is NOT cloaking. Cloaking is showing a search engine content a
# reader cannot get; here both parties are shown the same facts about the same
# record at the same URL, and the only difference is whether the markup arrives
# pre-assembled or is fetched by JavaScript. Google's own guidance draws the
# line at *equivalent content*, which this is, and its dynamic-rendering note
# says the same. The honest description is "server-side rendering for clients
# that do not execute JavaScript".
#
# `map` lives here, at http level, because a map cannot be declared inside a
# server block. This file is included from /etc/nginx/conf.d/*.conf, which nginx
# includes inside `http {}`, so the top of this file is http context and the
# `server {}` below is not.
#
# The default is a prefix that CANNOT exist rather than the empty string. With
# an empty default the first try_files candidate for a browser would be
# "$uri/index.html", which quietly probes the real document root; with
# "/_prerender-off" it probes a directory this image never creates, so a browser
# provably cannot be served a prerendered file by accident.
map $http_user_agent $prerender_prefix {
    default "/_prerender-off";

    # Search engines.
    "~*(googlebot|google-inspectiontool|storebot-google|bingbot|adidxbot|slurp|duckduckbot|baiduspider|yandex(bot|images)|applebot|petalbot|sogou|exabot|seznambot|mojeekbot|marginaliabot|qwantify)" "/_prerender";
    # Link unfurlers — these fetch once, read <title>/og:*, and never run JS.
    # A prerendered document is the entire reason a shared link has a preview.
    "~*(facebookexternalhit|facebookcatalog|twitterbot|linkedinbot|slackbot|slack-imgproxy|discordbot|telegrambot|whatsapp|skypeuripreview|redditbot|pinterest|embedly|quora link preview|nuzzel|vkshare|outbrain|bitlybot|xing-contenttabreceiver|mastodon|pleroma|misskey|iframely|opengraph)" "/_prerender";
    # Feed readers, archives, and the research/AI crawlers. Listed explicitly
    # rather than relying on the catch-all below, so the log of who we serve
    # this to is a readable list rather than a regex accident.
    "~*(feedly|feedfetcher|feedbin|inoreader|newsblur|theoldreader|rssapi|ia_archiver|archive\.org_bot|wayback|heritrix|ccbot|gptbot|oai-searchbot|chatgpt-user|claudebot|claude-web|anthropic-ai|perplexitybot|youbot|amazonbot|bytespider|diffbot|semrushbot|ahrefsbot|mj12bot|dotbot)" "/_prerender";
    # The catch-all, last. Ordering does not matter to nginx's map (it picks the
    # first matching regex in declaration order), so this stays at the bottom
    # deliberately: anything self-identifying as a bot, crawler or spider is a
    # client that will not run our JavaScript, and giving it the empty SPA shell
    # is how this site was invisible to every crawler until 2026-08-14.
    "~*(bot|crawler|spider|scraper|curl/|wget/|python-requests|libwww-perl|http_request)" "/_prerender";
}

server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers.
    #
    # The backend has had `helmet()` since it was written; the container serving
    # the actual HTML had nothing. That was survivable while every page rendered
    # this project's own JSON, and stops being survivable with `/source/{sha256}`
    # — the artifact viewer, which renders text extracted from third-party PDFs
    # and county HTML. `services/search.ts` already identified that hazard in its
    # own domain and solved it properly, marking matches with control characters
    # rather than `<b>` so nothing scraped is ever injected as markup. A CSP is
    # the same instinct one layer down: the careful rendering is the defence, and
    # this is what holds when someone forgets.
    #
    # `script-src 'self'` with no `unsafe-inline` is achievable because the Vite
    # build emits no inline script — verified against `dist/index.html`, which
    # carries one `<script type="module" src=...>` and nothing else. Keep it that
    # way; an inline handler added later fails here rather than silently
    # weakening the policy.
    #
    # `style-src` does carry `unsafe-inline`, and that is a real concession
    # rather than an oversight: React applies `style={{…}}` props at runtime, and
    # a handful of components use them for computed widths on vote bars and
    # progress rows. Styles are a far weaker injection vector than scripts, and
    # narrowing this would mean rewriting those components for no security win
    # worth the churn.
    #
    # No host is allowed beyond 'self'. That is what makes the geography design's
    # rule — no map tile provider may receive a reader's requests — a mechanism
    # rather than an intention: a commercial tile SDK added later is blocked
    # here, visibly, instead of quietly building the surveillance layer this
    # project exists to avoid.
    #
    # `always`, so the headers are present on error responses too. A 404 or a 500
    # is still a page a browser renders.
    #
    # This CSP is the result of a directive-by-directive comparison against the
    # backend's Helmet default (roadmap 6.4), taking the stricter value on every
    # directive both sides declare, plus the two directives only Helmet declared
    # (`script-src-attr`, `upgrade-insecure-requests`) — neither loosens anything,
    # both close a gap the nginx-only policy otherwise left open:
    #   default-src, base-uri, object-src, form-action, img-src, script-src  — identical both sides
    #   frame-ancestors  — nginx 'none' vs Helmet 'self': nginx is stricter, kept
    #   font-src, style-src  — Helmet adds `https:`; nginx's narrower 'self' (+ data:/unsafe-inline
    #                          where applicable) is stricter, kept
    #   frame-src, connect-src  — nginx-only; Helmet has no default for these (falls back to
    #                             default-src 'self', which is equivalent) — kept as-is
    #   script-src-attr 'none'  — Helmet-only; added here. Practically a no-op (script-src 'self'
    #                             already blocks inline attribute handlers by fallback) but explicit
    #                             beats implicit for an audit trail
    #   upgrade-insecure-requests  — Helmet-only; added here. Pure hardening, no cost: forces any
    #                                 stray http:// subresource reference onto https
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; script-src-attr 'none'; connect-src 'self'; upgrade-insecure-requests" always;
    # A reader following a citation from a page about a named official must not
    # send that page's URL to the county's web server.
    #
    # Helmet's own default is `no-referrer`, which is stricter still in the
    # abstract (it withholds the origin too, even same-origin). Kept
    # `strict-origin-when-cross-origin` anyway: this is a deliberate, already-
    # documented choice for this exact concern, sending only the origin
    # cross-origin already satisfies it, and the CSP above forbids any
    # third-party endpoint from ever reading a referrer in the first place. Not
    # silently weakened — flagged here as the one directive where "keep the
    # stricter value" was not applied, for the operator to override if they
    # disagree.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # Opts out of the ambient permissions this site never asks for, so a future
    # dependency cannot start asking on its behalf.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    # Roadmap 6.4: nginx is the one layer in the request path for BOTH the HTML
    # document and /api/* (Helmet, on the backend, never sees a request for
    # `/`), so it is the only place HSTS can cover the whole surface. A year,
    # plus subdomains — this is the shared host's only web-facing hostname on
    # this project, and there is no non-HTTPS path here to break.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # `^~`, not a plain prefix. nginx tries regex locations BEFORE plain prefix
    # matches, so the static-extension regex added below would otherwise capture
    # /api/data/meetings.csv and every other .json/.csv export and try to serve
    # it from disk — a 404 on the bulk-data routes. `^~` stops the regex phase
    # from running at all once this prefix matches.
    location ^~ /api/ {
        # nginx resolves a LITERAL proxy_pass hostname once, at config-parse
        # time, and exits if it does not resolve — it does not retry. With
        # `proxy_pass http://backend:3001;` this container dies at startup with
        #   [emerg] host not found in upstream "backend"
        # whenever it starts before the backend exists in DNS. That was observed
        # on the first production deploy: it crash-looped until the backend
        # finished starting, and only recovered because restart: unless-stopped
        # kept trying, which is luck rather than design.
        #
        # A VARIABLE upstream defers resolution to request time, so nginx starts
        # cleanly and the first few requests fail instead of the whole server.
        # The resolver is Docker's embedded DNS, which exists on user-defined
        # networks (cw-internal) but not on the default bridge.
        #
        # The variable deliberately carries no URI part: nginx only replaces the
        # request URI when the directive specifies one, so the original path —
        # including the /api/ prefix the backend routes on — is passed through
        # unchanged, exactly as the literal form did.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://backend:3001;
        # Must match the backend's listen port (backend/src/index.ts: PORT || 3001).
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Written into the image at build time (frontend/Dockerfile). The deploy
    # compares it against /api/version to catch a half-finished rollout.
    #
    # no-store matters: a cached copy would report the version that was current
    # when it was cached, which is precisely the answer that makes a skewed
    # deploy invisible. Also kept out of the SPA fallback below — try_files
    # would otherwise serve index.html for a missing version.json, and the
    # check would be comparing an HTML document instead of failing.
    location = /version.json {
        # The security headers are repeated here, and they have to be.
        #
        # nginx's `add_header` does not merge across levels: a location that
        # declares ANY `add_header` of its own discards every one inherited from
        # the server block. So the `Cache-Control` line below would silently
        # strip the CSP and the rest from this response — a policy that is
        # present on every page except the one an automated deploy check reads.
        #
        # This is the same shape as the `^~ /api/` fix above: nginx's defaults
        # are not what a reader of the file assumes, and the only way to know is
        # to run it and look. Verified by curling this path in a container.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; script-src-attr 'none'; connect-src 'self'; upgrade-insecure-requests" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        try_files $uri =404;
    }

    # Generated from the database — see backend/src/routes/sitemap.ts. An
    # exact-match location beats the regex below and the prefix below that, so
    # this wins without ordering games.
    #
    # It cannot be a static file: the URL list is every published meeting, and
    # publication is an operator decision taken long after the image is built.
    location = /sitemap.xml {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $sitemap_upstream http://backend:3001;
        proxy_pass $sitemap_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The feeds, generated from the `events` table — see backend/src/routes/feed.ts.
    #
    # Exact-match locations, and both are needed for different reasons:
    #
    #   /feed.xml  would be captured by the static-extension regex below and
    #              answered from disk, i.e. 404. That is precisely what happened
    #              to /robots.txt before this file grew that block, and the
    #              symptom is identical — a crawler or a feed reader is told,
    #              politely, that we publish nothing.
    #   /feed.rss  is NOT matched by that regex (`rss` is not in the list), so it
    #              would fall through to the SPA and return the application
    #              shell with a 200. That is worse than the 404: a feed reader
    #              gets HTML where it expected XML and reports the feed as
    #              malformed rather than missing.
    #
    # Two paths, two different wrong answers, one fix. A query string does not
    # participate in location matching, so `= /feed.xml` still serves
    # /feed.xml?q=rezone — which is the whole query-feed channel.
    location = /feed.xml {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $feed_upstream http://backend:3001;
        proxy_pass $feed_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /feed.rss {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $feed_rss_upstream http://backend:3001;
        proxy_pass $feed_rss_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The MCP server — see backend/src/services/delivery/mcp.ts.
    #
    # Two locations, and the second is the one that would have been missed.
    # `/.well-known/mcp.json` ends in `.json`, so the static-extension regex
    # below captures it and answers from the SPA's disk with a 404. That is the
    # /robots.txt failure and the /feed.xml failure a third time: a client is
    # told, in a well-formed way, that this server does not exist. An exact
    # match beats a regex whatever the order, so `=` is the fix rather than
    # moving blocks around.
    #
    # `/mcp` carries no extension and would otherwise fall through to the SPA
    # and return the application shell with a 200 — worse than a 404, because a
    # JSON-RPC client reports a parse error rather than an absent server.
    #
    # Both proxy unconditionally. The backend 404s both paths unless MCP_ENABLED
    # is set, which is how the feature ships dark: indistinguishable from not
    # existing, and the flag lives in exactly one place rather than being
    # duplicated into the edge.
    location = /mcp {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mcp_upstream http://backend:3001;
        proxy_pass $mcp_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /.well-known/mcp.json {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mcp_discovery_upstream http://backend:3001;
        proxy_pass $mcp_discovery_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Addresses this site published before the vocabulary was settled.
    #
    # A real 301 here rather than only the in-app <Navigate>: a crawler asking
    # for /anomalies never runs the SPA, so a client-side redirect is invisible
    # to it and the old address stays in the index forever, competing with the
    # new one. Both are in sitemap.xml and being crawled, and a transparency
    # project does not break a URL it asked people to cite — the same reasoning
    # that keeps /data-license alive beside /data.
    #
    # Exact-match, so /anomalies/<id> is untouched and still reaches the app.
    # See frontend/src/vocabulary.ts for what was renamed and why.
    #
    # `absolute_redirect off` is load-bearing and was not obvious. nginx builds
    # a redirect's Location from the request's Host and *its own listen port*,
    # so `return 301 /findings` emitted
    #   Location: http://commissionwatch.bmux.sh:3000/findings
    # — this container listens on 3000 behind Caddy, and port 3000 is not
    # reachable from the internet. Every renamed URL would have redirected a
    # reader, and a crawler, to a dead address. Caught by running the config in
    # a container and reading the header; `nginx -t` is happy with it.
    #
    # A relative Location is also simply correct here: the target is on the same
    # host by construction, and RFC 7231 has allowed relative redirects since
    # 2014.
    absolute_redirect off;
    location = /anomalies { return 301 /findings; }
    location = /members   { return 301 /officials; }

    # A missing file must 404, not fall through to the SPA.
    #
    # This is the same reasoning the /version.json block above already spells
    # out, generalised: try_files would serve index.html for anything absent, so
    # a crawler asking for /robots.txt got a 200 and the 525-byte application
    # shell. That is worse than a 404 in both directions — the crawler cannot
    # tell we have no policy, and we cannot tell anybody asked. Verified on the
    # live site 2026-08-14: /robots.txt, /sitemap.xml and /llms.txt all returned
    # 200 text/html.
    #
    # Extensions only. A SPA route has no dot in its last segment, so
    # /meetings/<uuid> is untouched and still renders the app.
    location ~* \.(txt|xml|json|csv|ics|map|webmanifest)$ {
        try_files $uri =404;
    }

    # The prerendered tree is readable BY THIS SERVER and by nobody else.
    #
    # `internal` refuses any request that arrives from the outside with 404,
    # while leaving the files reachable through the `try_files` below — a
    # try_files candidate that resolves to an existing file is served directly
    # off the filesystem and never re-enters location matching, so this block
    # constrains external addressing only.
    #
    # Two things must not be fetchable, and both would be without this:
    #
    #   /_prerender/.prerender-cursor.json   the consumer's replication cursor.
    #                                        nginx has no dotfile rule; it would
    #                                        serve this as JSON to anyone asking.
    #   /_prerender/meetings/{id}/index.html a second, canonical-carrying address
    #                                        for every record. Two URLs serving
    #                                        one document is the duplicate-content
    #                                        problem this feature exists to fix.
    #
    # `^~`, not a plain prefix, for the reason the /api/ block above gives: the
    # static-extension regex further down runs BEFORE plain prefix locations and
    # would capture the cursor file's .json and serve it from disk. `^~` ends
    # the regex phase as soon as this prefix matches.
    location ^~ /_prerender/ {
        internal;
    }

    location / {
        # add_header does not merge across levels — the /version.json block
        # above spells this trap out. Declaring `Vary` here would otherwise drop
        # the CSP and the rest from every page of the site, which is the exact
        # inverse of what a security header is for. So the server-level set is
        # repeated in full. Verified by curling this location and reading the
        # headers, not by reading this comment.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; script-src-attr 'none'; connect-src 'self'; upgrade-insecure-requests" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # This location's body depends on the User-Agent, so any cache between
        # here and a reader must key on it. Without this the shared Caddy — or
        # any proxy a reader sits behind — can serve a crawler's unstyled
        # document to the next human who asks for the same URL, which is the one
        # failure mode that would turn a defensible rendering decision into a
        # visible breakage. Scoped to this location, because it is the only one
        # whose answer varies.
        add_header Vary "User-Agent" always;

        # First candidate: the prerendered document, for a client that will not
        # run JavaScript. `$prerender_prefix` is "/_prerender-off" for everyone
        # else, so their first candidate is a path this image does not contain.
        #
        # `/index.html` under the record path rather than `{path}.html` is what
        # the store already writes (backend/src/services/prerender/store.ts) and
        # is what fits here: a SPA route has no extension, so only a directory
        # candidate can match it.
        #
        # A missing prerendered page is not an error — it falls straight through
        # to the SPA shell, which is also what happens with the volume empty,
        # with PRERENDER_ENABLED unset, and on every route the consumer does not
        # render (/, /search, /calendar, /admin/*). That is the whole failure
        # mode of this feature: the site behaves exactly as it did before.
        try_files $prerender_prefix$uri/index.html $uri $uri/ /index.html;
    }
}
