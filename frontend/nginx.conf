server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers.
    #
    # The backend has had `helmet()` since it was written; the container serving
    # the actual HTML had nothing. That was survivable while every page rendered
    # this project's own JSON, and stops being survivable with `/source/{sha256}`
    # — the artifact viewer, which renders text extracted from third-party PDFs
    # and county HTML. `services/search.ts` already identified that hazard in its
    # own domain and solved it properly, marking matches with control characters
    # rather than `<b>` so nothing scraped is ever injected as markup. A CSP is
    # the same instinct one layer down: the careful rendering is the defence, and
    # this is what holds when someone forgets.
    #
    # `script-src 'self'` with no `unsafe-inline` is achievable because the Vite
    # build emits no inline script — verified against `dist/index.html`, which
    # carries one `<script type="module" src=...>` and nothing else. Keep it that
    # way; an inline handler added later fails here rather than silently
    # weakening the policy.
    #
    # `style-src` does carry `unsafe-inline`, and that is a real concession
    # rather than an oversight: React applies `style={{…}}` props at runtime, and
    # a handful of components use them for computed widths on vote bars and
    # progress rows. Styles are a far weaker injection vector than scripts, and
    # narrowing this would mean rewriting those components for no security win
    # worth the churn.
    #
    # No host is allowed beyond 'self'. That is what makes the geography design's
    # rule — no map tile provider may receive a reader's requests — a mechanism
    # rather than an intention: a commercial tile SDK added later is blocked
    # here, visibly, instead of quietly building the surveillance layer this
    # project exists to avoid.
    #
    # `always`, so the headers are present on error responses too. A 404 or a 500
    # is still a page a browser renders.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;
    # A reader following a citation from a page about a named official must not
    # send that page's URL to the county's web server.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # Opts out of the ambient permissions this site never asks for, so a future
    # dependency cannot start asking on its behalf.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;

    # `^~`, not a plain prefix. nginx tries regex locations BEFORE plain prefix
    # matches, so the static-extension regex added below would otherwise capture
    # /api/data/meetings.csv and every other .json/.csv export and try to serve
    # it from disk — a 404 on the bulk-data routes. `^~` stops the regex phase
    # from running at all once this prefix matches.
    location ^~ /api/ {
        # nginx resolves a LITERAL proxy_pass hostname once, at config-parse
        # time, and exits if it does not resolve — it does not retry. With
        # `proxy_pass http://backend:3001;` this container dies at startup with
        #   [emerg] host not found in upstream "backend"
        # whenever it starts before the backend exists in DNS. That was observed
        # on the first production deploy: it crash-looped until the backend
        # finished starting, and only recovered because restart: unless-stopped
        # kept trying, which is luck rather than design.
        #
        # A VARIABLE upstream defers resolution to request time, so nginx starts
        # cleanly and the first few requests fail instead of the whole server.
        # The resolver is Docker's embedded DNS, which exists on user-defined
        # networks (cw-internal) but not on the default bridge.
        #
        # The variable deliberately carries no URI part: nginx only replaces the
        # request URI when the directive specifies one, so the original path —
        # including the /api/ prefix the backend routes on — is passed through
        # unchanged, exactly as the literal form did.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://backend:3001;
        # Must match the backend's listen port (backend/src/index.ts: PORT || 3001).
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Written into the image at build time (frontend/Dockerfile). The deploy
    # compares it against /api/version to catch a half-finished rollout.
    #
    # no-store matters: a cached copy would report the version that was current
    # when it was cached, which is precisely the answer that makes a skewed
    # deploy invisible. Also kept out of the SPA fallback below — try_files
    # would otherwise serve index.html for a missing version.json, and the
    # check would be comparing an HTML document instead of failing.
    location = /version.json {
        # The security headers are repeated here, and they have to be.
        #
        # nginx's `add_header` does not merge across levels: a location that
        # declares ANY `add_header` of its own discards every one inherited from
        # the server block. So the `Cache-Control` line below would silently
        # strip the CSP and the rest from this response — a policy that is
        # present on every page except the one an automated deploy check reads.
        #
        # This is the same shape as the `^~ /api/` fix above: nginx's defaults
        # are not what a reader of the file assumes, and the only way to know is
        # to run it and look. Verified by curling this path in a container.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        try_files $uri =404;
    }

    # Generated from the database — see backend/src/routes/sitemap.ts. An
    # exact-match location beats the regex below and the prefix below that, so
    # this wins without ordering games.
    #
    # It cannot be a static file: the URL list is every published meeting, and
    # publication is an operator decision taken long after the image is built.
    location = /sitemap.xml {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $sitemap_upstream http://backend:3001;
        proxy_pass $sitemap_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Addresses this site published before the vocabulary was settled.
    #
    # A real 301 here rather than only the in-app <Navigate>: a crawler asking
    # for /anomalies never runs the SPA, so a client-side redirect is invisible
    # to it and the old address stays in the index forever, competing with the
    # new one. Both are in sitemap.xml and being crawled, and a transparency
    # project does not break a URL it asked people to cite — the same reasoning
    # that keeps /data-license alive beside /data.
    #
    # Exact-match, so /anomalies/<id> is untouched and still reaches the app.
    # See frontend/src/vocabulary.ts for what was renamed and why.
    #
    # `absolute_redirect off` is load-bearing and was not obvious. nginx builds
    # a redirect's Location from the request's Host and *its own listen port*,
    # so `return 301 /findings` emitted
    #   Location: http://commissionwatch.bmux.sh:3000/findings
    # — this container listens on 3000 behind Caddy, and port 3000 is not
    # reachable from the internet. Every renamed URL would have redirected a
    # reader, and a crawler, to a dead address. Caught by running the config in
    # a container and reading the header; `nginx -t` is happy with it.
    #
    # A relative Location is also simply correct here: the target is on the same
    # host by construction, and RFC 7231 has allowed relative redirects since
    # 2014.
    absolute_redirect off;
    location = /anomalies { return 301 /findings; }
    location = /members   { return 301 /officials; }

    # A missing file must 404, not fall through to the SPA.
    #
    # This is the same reasoning the /version.json block above already spells
    # out, generalised: try_files would serve index.html for anything absent, so
    # a crawler asking for /robots.txt got a 200 and the 525-byte application
    # shell. That is worse than a 404 in both directions — the crawler cannot
    # tell we have no policy, and we cannot tell anybody asked. Verified on the
    # live site 2026-08-14: /robots.txt, /sitemap.xml and /llms.txt all returned
    # 200 text/html.
    #
    # Extensions only. A SPA route has no dot in its last segment, so
    # /meetings/<uuid> is untouched and still renders the app.
    location ~* \.(txt|xml|json|csv|ics|map|webmanifest)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
